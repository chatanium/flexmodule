version: v1
plugins:
  - plugin: go
    path: ../.tools/bin/protoc-gen-go
    out: .
    opt:
      - paths=source_relative
  - plugin: go-grpc
    path: ../.tools/bin/protoc-gen-go-grpc
    out: .
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
