syntax = "proto3";

package flexmodule.discord.v2;

option go_package = "github.com/thirdscam/chatanium-flexmodule/proto/discord-v2;discordv2";

import "core-v2/core.proto";
import "google/protobuf/empty.proto";

// Routing kinds are not Discord InteractionType numeric values.
enum InteractionRouteKind {
  INTERACTION_ROUTE_KIND_UNSPECIFIED = 0;
  INTERACTION_ROUTE_KIND_MESSAGE_COMPONENT = 1;
  INTERACTION_ROUTE_KIND_MODAL_SUBMIT = 2;
}

// An exact application/kind/custom-id claim, never a wildcard or prefix.
// Stable ownership comes only from the authenticated connection principal.
message InteractionRouteClaim {
  string application_id = 1;
  InteractionRouteKind interaction_kind = 2;
  string custom_id = 3;
}

message RegisterInteractionRoutesRequest {
  repeated InteractionRouteClaim claims = 1;
}

message UnregisterInteractionRoutesRequest {
  repeated InteractionRouteClaim claims = 1;
}

message GetProvisionedCredentialRefRequest {
  string binding_name = 1;
}

service BackendOwnership {
  // Atomically claims the complete batch for the authenticated stable ModuleID.
  // Identical owned claims succeed; a foreign collision rejects the whole batch.
  // INIT and RUNNING only. Claims survive restarts until unregister or uninstall.
  rpc RegisterInteractionRoutes(RegisterInteractionRoutesRequest) returns (google.protobuf.Empty);

  // Atomically releases owned claims, including during drain. Already absent
  // claims are harmless; any foreign owner rejects the complete batch.
  rpc UnregisterInteractionRoutes(UnregisterInteractionRoutesRequest) returns (google.protobuf.Empty);

  // Issues a finite, instance-bound ref for an operator-provisioned binding.
  // INIT and RUNNING only; no raw secrets or bot-token references are exposed.
  rpc GetProvisionedCredentialRef(GetProvisionedCredentialRefRequest) returns (flexmodule.core.v2.CredentialRef);
}
